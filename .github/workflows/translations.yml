name: Translation completeness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-languages.mjs --check
      - run: node scripts/build-learning.mjs --check
      - run: node --test tests/language*.test.cjs tests/learning-house.test.cjs tests/blob-knowledge.test.cjs tests/blob-suggestions.test.cjs
